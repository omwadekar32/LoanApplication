# ===================== Server =====================
server.port=8080

# ===================== Database (H2, file-based) =====================
# Data is written to ./data/loanconnect.mv.db in the project root, so
# submitted applications persist across restarts. Delete that file to reset.
spring.datasource.url=jdbc:h2:file:./data/loanconnect;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2's web console for browsing saved data during development:
# http://localhost:8080/h2-console  (JDBC URL must match the one above)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===================== JPA / Hibernate =====================
# update: auto-creates/updates tables from the entity classes on startup.
# Fine for development; use a migration tool (Flyway/Liquibase) in production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================== Misc =====================
spring.application.name=loanconnect-api

# ---------------------------------------------------------------
# TO SWITCH TO MYSQL LATER:

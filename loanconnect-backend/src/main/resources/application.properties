#        <scope>runtime</scope>
#      </dependency>
# 2. Replace the datasource lines above with:
#      spring.datasource.url=jdbc:mysql://localhost:3306/loanconnect?createDatabaseIfNotExist=true
#      spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#      spring.datasource.username=root
#      spring.datasource.password=yourpassword
# No Java code needs to change — Spring Data JPA handles the rest.

# ===================== Server =====================
server.port=8080

# ===================== Database (H2, file-based) =====================
# Aiven MySQL Database Connection
spring.datasource.url=jdbc:mysql://mysql-262d1d73-omwadekar32-70bb.b.aivencloud.com:12337/loanapp?useSSL=true&requireSSL=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===================== JPA / Hibernate =====================
# update: auto-creates/updates tables from the entity classes on startup.
# Fine for development; use a migration tool (Flyway/Liquibase) in production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================== Misc =====================
spring.application.name=loanconnect-api

